name: Deploy HolyLens website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - name: Wait for uploaded artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..18}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${count:-0}" -gt 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded GitHub Pages artifact is not visible yet."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
