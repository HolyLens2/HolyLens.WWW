name: Deploy HolyLens website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare project Pages paths
        run: |
          cp -a static-site _site
          find _site -type f \( -name '*.html' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's|="/|="/HolyLens.WWW/|g' \
            -e 's|url=/|url=/HolyLens.WWW/|g' \
            -e 's|url(/|url(/HolyLens.WWW/|g'
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
